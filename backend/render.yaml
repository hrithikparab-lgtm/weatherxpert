services:
  # ── Backend: FastAPI ──────────────────────────────
  - type: web
    name: weatherxpert-api
    runtime: python
    rootDir: weatherxpert-backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: weatherxpert-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://weatherxpert.onrender.com
      - key: DEBUG
        value: "false"
      - key: TOMORROW_IO_API_KEY
        sync: false        # set manually in Render dashboard
      - key: IMD_API_KEY
        sync: false        # set manually in Render dashboard
    healthCheckPath: /health

  # ── Frontend: React/Vite static site ─────────────
  - type: web
    name: weatherxpert
    runtime: node
    rootDir: weatherxpert
    buildCommand: npm install && npm run build
    startCommand: npx serve dist -l $PORT
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://weatherxpert-api.onrender.com/api/v1
      - key: NODE_VERSION
        value: "20"

databases:
  # ── PostgreSQL ────────────────────────────────────
  - name: weatherxpert-db
    plan: free
    databaseName: weatherxpert
    user: weatherxpert
